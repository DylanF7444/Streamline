name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e ".[desktop,test,dev,ui-test,build]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Check lint
        run: python -m ruff check .
      - name: Check documentation
        run: python scripts/check_documentation_consistency.py
      - name: Check standalone import boundary
        run: python scripts/check_personal_hub_imports.py --output .benchmark-data/personal-hub-imports.json
      - name: Run complete test lane
        run: powershell -ExecutionPolicy Bypass -File scripts/test_personal_hub.ps1 -Lane all

  package-smoke:
    needs: [quality-and-tests]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -e ".[desktop,build]"
      - name: Build executable
        run: python -m PyInstaller --clean --noconfirm packaging/personal-hub.spec
      - name: Verify packaged boundary
        run: python scripts/verify_personal_hub_package.py dist/PersonalHub.exe --analysis build/personal-hub/Analysis-00.toc
